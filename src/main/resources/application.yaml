spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: eproz

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false          # a lazy load in the view layer is a query nobody planned
    hibernate:
      ddl-auto: validate         # Flyway owns the schema, never Hibernate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info

server:
  port: ${SERVER_PORT:8072}
  error:
    include-message: never       # errors go through GlobalExceptionHandler
